spring:
  application:
    name: content-agent-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/arjun_content_agent}
    username: ${SPRING_DATASOURCE_USERNAME:arjun_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:change_me_strong_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-ttl-minutes: ${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${JWT_REFRESH_TOKEN_TTL_DAYS:7}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    bucket: ${STORAGE_BUCKET:arjun-content-media}
    region: ${STORAGE_REGION:us-east-1}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
  ai:
    provider:
      base-url: ${AI_PROVIDER_BASE_URL:https://api.openai.com/v1}
      api-key: ${AI_PROVIDER_API_KEY:}
      model: ${AI_PROVIDER_MODEL:gpt-4o-mini}
  instagram:
    graph-api-base-url: ${IG_GRAPH_API_BASE_URL:https://graph.facebook.com/v19.0}
    app-id: ${IG_APP_ID:}
    app-secret: ${IG_APP_SECRET:}
    business-account-id: ${IG_BUSINESS_ACCOUNT_ID:}
    access-token: ${IG_ACCESS_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
