services:
  postgres:
    image: postgres:16-alpine
    container_name: arjun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arjun_content_agent}
      POSTGRES_USER: ${POSTGRES_USER:-arjun_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arjun_admin} -d ${POSTGRES_DB:-arjun_content_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: arjun-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-arjun_minio_admin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-change_me_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: arjun-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-arjun_content_agent}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-arjun_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong_password}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_ACCESS_TOKEN_TTL_MINUTES: ${JWT_ACCESS_TOKEN_TTL_MINUTES:-15}
      JWT_REFRESH_TOKEN_TTL_DAYS: ${JWT_REFRESH_TOKEN_TTL_DAYS:-7}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-arjun_minio_admin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-change_me_minio_secret}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-arjun-content-media}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_PATH_STYLE_ACCESS: ${STORAGE_PATH_STYLE_ACCESS:-true}
      AI_PROVIDER_BASE_URL: ${AI_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER_MODEL: ${AI_PROVIDER_MODEL:-gpt-4o-mini}
      IG_GRAPH_API_BASE_URL: ${IG_GRAPH_API_BASE_URL:-https://graph.facebook.com/v19.0}
      IG_APP_ID: ${IG_APP_ID:-}
      IG_APP_SECRET: ${IG_APP_SECRET:-}
      IG_BUSINESS_ACCOUNT_ID: ${IG_BUSINESS_ACCOUNT_ID:-}
      IG_ACCESS_TOKEN: ${IG_ACCESS_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: arjun-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  minio_data:
