spring:
  jpa:
    show-sql: true

app:
  cookie:
    # Plain HTTP over localhost in dev - Secure cookies would never be sent.
    secure: ${COOKIE_SECURE:false}

logging:
  level:
    root: INFO
    com.arjunsports.contentagent: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
